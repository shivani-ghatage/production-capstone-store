
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive e-commerce capstone project.">
  <title>ShopSmart | Online Store</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>ShopSmart</h1>
    <p>Your simple online shopping experience</p>
    <p id="accountStatus" aria-live="polite">Guest mode</p>
  </header>

  <main class="container">
    <section class="panel" aria-labelledby="accountHeading">
      <h2 id="accountHeading">Demo Account</h2>
      <form id="loginForm">
        <label for="userName">Your name</label>
        <input id="userName" type="text" maxlength="50" required>
        <button type="submit">Sign in</button>
      </form>
      <button id="logoutButton" type="button" hidden>Sign out</button>
    </section>

    <section id="adminPanel" class="panel" hidden>
      <h2>Manage Products</h2>
      <form id="productForm">
        <input id="editProductId" type="hidden">

        <label for="productName">Product name</label>
        <input id="productName" type="text" maxlength="100" required>

        <label for="productPrice">Price (₹)</label>
        <input id="productPrice" type="number" min="0.01"
          step="0.01" required>

        <label for="productCategory">Category</label>
        <input id="productCategory" type="text" maxlength="50" required>

        <label for="productImage">Image URL (optional)</label>
        <input id="productImage" type="url"
          placeholder="https://example.com/image.jpg">

        <button id="saveProductButton" type="submit">Add product</button>
        <button id="cancelEditButton" type="button" hidden>
          Cancel edit
        </button>
      </form>
    </section>

    <section class="panel" aria-label="Search and filter products">
      <label for="searchInput">Search</label>
      <input id="searchInput" type="search" placeholder="Find a product...">

      <label for="categoryFilter">Category</label>
      <select id="categoryFilter">
        <option value="all">All categories</option>
      </select>

      <label for="sortFilter">Sort by</label>
      <select id="sortFilter">
        <option value="default">Default</option>
        <option value="low-high">Price: low to high</option>
        <option value="high-low">Price: high to low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </section>

    <section class="panel">
      <h2>Your Cart</h2>
      <p id="cartCount" aria-live="polite">Cart items: 0</p>
      <div id="cartItems"></div>
    </section>

    <p id="status" role="status" aria-live="polite">
      Loading products...
    </p>

    <section id="productGrid" class="product-grid"
      aria-label="Product catalog"></section>
  </main>

  <footer>
    <p>ShopSmart — Production Capstone Project</p>
  </footer>
</body>
</html>
